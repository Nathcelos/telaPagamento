<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Pagamento</title>

    <!-- Conecta o arquivo CSS responsável pela aparência da página -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Contêiner principal da página de pagamento -->
    <div id="container">

    <!-- Campo do valor da compra -->
     <label for="valor">Valor</label>
     <input type="number" id="valor">

    <!-- Opções de pagamento -->
    <div>
        <input type="radio" id="pix" name="pagamento" value="pix">
        <label for="pix">Pix</label>
        <input type="radio" id="cartao" name="pagamento" value="cartao">
        <label for="cartao">Cartão de Crédito</label>
    </div>

    <!-- Botão Informar dados -->
    <button id="informar-dados">Informar Dados</button>

    <!-- Painel Pix -->
     <div id="painel-pix">
     <h3>Pix</h3>
     <label for="cpf">CPF:</label>
     <input type="text" id="cpf">
     </div>

    <!-- Painel Cartão de Crédito -->
     <div id="painel-cartao">
        <h3>Cartão de Crédito</h3>
        <label for="numero-cartao">Número do Cartão:</label>

       <!-- Campo e imagem ficam na mesma linha -->
        <div class="campo-cartao">
            <input type="text" id="numero-cartao">
            <!-- Imagem da bandeira do cartão -->
             <img id="imagem-cartao" src="" alt="Bandeira do cartão">
        </div>

<!-- Mensagem de validação do cartão -->
<p id="mensagem-cartao"></p>

        <label for="titular">Nome do Titular:</label>
        <input type="text" id="titular">

        <label for="cod-seguranca">Código de Segurança:</label>
        <input type="text" id="cod-seguranca">

        <label for="vencimento">Vencimento:</label>
        <input type="text" id="vencimento" placeholder="MM/AA">

        <label for="parcelas">Parcelas:</label>
        <select id="parcelas">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
            <option value="5">5x</option>
        </select>
     </div>

    <!-- Total e botão Pagar -->
    <p>Total: <span id="total">R$ 0,00</span></p>
    <button id="pagar">Pagar</button>

    </div>

    <!-- Conecta o arquivo JavaScript responsável pelas funcionalidades da página -->
    <script src="script.js" ></script>
</body>
</html>
